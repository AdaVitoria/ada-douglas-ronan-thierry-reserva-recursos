name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Build
        id: build
        run: npm run build

      - name: Comentar no PR quando quebrar
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const falhou = '${{ steps.lint.outcome }}' === 'failure' ? 'lint' : 'build'

            const piadas = {
              lint: [
                'O ESLint leu o código e pediu um tempo.',
                'Boa notícia: o lint funciona. Má notícia: é exatamente por isso que estamos aqui.',
                'O lint encontrou coisas. Várias coisas. Ele gostaria de conversar.',
                'Ninguém gosta do lint até o dia em que ele estava certo.',
              ],
              build: [
                'O lint passou, então o código está impecavelmente escrito — e quebrado.',
                'Compilar era a parte fácil, diziam.',
                'O Next tentou. De verdade. Não deu.',
                'O build falhou, mas a intenção era excelente.',
              ],
            }

            const lista = piadas[falhou]
            const piada = lista[Number('${{ github.run_number }}') % lista.length]

            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `### CI vermelho — falhou no \`${falhou}\``,
                '',
                `> ${piada}`,
                '',
                `Detalhes em [log da execução](${url}).`,
                '',
                `Commit: \`${context.sha.slice(0, 7)}\``,
              ].join('\n'),
            })
